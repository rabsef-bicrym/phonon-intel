name: Intel macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-test.txt
      - run: python build.py
      - run: python tests/run.py
      - run: python benchmarks/summarize.py
